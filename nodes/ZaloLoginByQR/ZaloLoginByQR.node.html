<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Zalo QR Login</title>
		<!-- Link to your CSS file -->
		<link rel="stylesheet" href="ZaloLoginByQR.node.css" />
	</head>
	<body>
		<div class="zalo-qr-container">
			<h4>Zalo QR Login Status</h4>

			<!-- Status Message Area -->
			<p id="zalo-status-message" class="status-message">Execute node to start login process...</p>

			<!-- QR Code Image Area (initially hidden) -->
			<div id="zalo-qr-wrapper" class="qr-code-wrapper" style="display: none">
				<img id="zalo-qr-image" src="" alt="Zalo Login QR Code" />
				<p>Scan using the Zalo App</p>
			</div>

			<!-- Loading Indicator (optional) -->
			<div id="zalo-loading" style="display: none">Loading QR Code...</div>
		</div>

		<!-- Link to your JavaScript file -->
		<script src="ZaloLoginByQR_FE.node.js" defer></script>
	</body>
</html>

<script>
	// Wait for the HTML document to be fully loaded and parsed
document.addEventListener('DOMContentLoaded', function () {
	// --- All your existing code goes inside this function ---

	// Get references to the DOM elements
	const statusMessageElement = document.getElementById('zalo-status-message');
	const qrWrapperElement = document.getElementById('zalo-qr-wrapper');
	const qrImageElement = document.getElementById('zalo-qr-image');
	const loadingElement = document.getElementById('zalo-loading'); // Optional

	// Function to update status display
	function updateStatus(message, status) {
		if (statusMessageElement) {
			statusMessageElement.textContent = message || '';
			statusMessageElement.className = 'status-message'; // Reset
			if (status) {
				statusMessageElement.classList.add(`status-${status}`);
			}
			statusMessageElement.style.display = message ? 'block' : 'none';
		}
		if (loadingElement) {
			loadingElement.style.display = status === 'waiting' && !qrImageElement.src ? 'block' : 'none';
		}
	}

	// Function to display the QR code
	function displayQrCode(qrCodeDataUrl, message, status) {
		if (qrWrapperElement && qrImageElement) {
			qrImageElement.src = qrCodeDataUrl || '';
			qrWrapperElement.style.display = qrCodeDataUrl ? 'block' : 'none';
			updateStatus(message || 'Scan the QR Code', status || 'waiting');
		}
	}

	// Function to clear the QR code display
	function clearQrCode() {
		if (qrWrapperElement && qrImageElement) {
			qrImageElement.src = '';
			qrWrapperElement.style.display = 'none';
		}
	}

	// N8N MESSAGE LISTENING (Hypothetical addNodeMessageHandler)
	function handleBackendMessage(data) {
		console.log('UI Received Message:', data);
		// ... (rest of your handler code) ...
		if (!data || typeof data !== 'object' || !data.type) return;

		switch (data.type) {
			case 'displayZaloQR':
				displayQrCode(data.qrCodeDataUrl, data.message, data.status);
				break;
			case 'clearZaloQR':
				clearQrCode();
				break;
			case 'loginStatusUpdate':
				updateStatus(data.message, data.status);
				if (['error', 'success', 'expired', 'scanned'].includes(data.status)) {
					clearQrCode();
				}
				break;
			default:
				console.warn(`Unhandled message type: ${data.type}`);
		}
	}

	// REGISTER THE LISTENER (Replace with actual n8n API)
	try {
		if (typeof window.parent.addNodeMessageHandler === 'function') {
			window.parent.addNodeMessageHandler(handleBackendMessage);
			console.log('HTML UI: Message handler registered.');
			updateStatus('UI Ready. Execute node to begin.', null);
		} else {
			console.warn('HTML UI: Could not find message handler registration function.');
			updateStatus('UI Loaded, but message listening may fail.', 'error');
		}
	} catch (error) {
		console.error('HTML UI: Error setting up message listener:', error);
		updateStatus('Error initializing UI communication.', 'error');
	}

	// --- End of code that needs the DOM ---
}); // End of DOMContentLoaded listener
console.log('--- ZaloLoginByQR.node.js script finished initial execution ---');

</script>
